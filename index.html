<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Apoio operacional ACOP/IMMU para o Sou Manaus Passo a Paço 2026: ponto de embarque, passagem prevista pelo ponto e avisos por linha.">
<meta name="theme-color" content="#312783">
<title>Apoio Operacional — Sou Manaus Passo a Paço 2026</title>

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/img/icone-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="assets/img/icone-192.png">

<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/telas/mapa.css">
<link rel="stylesheet" href="assets/css/telas/busca.css">
<link rel="stylesheet" href="assets/css/telas/ponto.css">
<link rel="stylesheet" href="assets/css/telas/linha.css">
<link rel="stylesheet" href="assets/css/telas/quadro.css">
<link rel="stylesheet" href="assets/css/telas/avisos.css">
</head>
<body>

<!-- O cabecalho esta partido em dois de proposito.

     IDENTIFICACAO (#cabecalho) e branding: quem le, le uma vez. Rola embora
     junto com o conteudo e nao volta.

     CONTROLES (#controles) e a barra de trabalho do supervisor: buscar linha,
     escolher o dia, trocar de secao. Fica grudada no topo, porque e usada o
     tempo todo e no meio da rua ninguem quer rolar ate o topo para pesquisar
     a proxima linha.

     Antes os dois eram um bloco so, de 298px + 48px de abas: 43% da tela de um
     celular gastos antes da primeira linha de conteudo. -->
<header id="cabecalho">
  <div class="envolve">
    <h1>Sou Manaus Passo a Paço 2026</h1>
    <p class="sublinha">Apoio operacional — ACOP / IMMU · OS Urbano nº 057/2025</p>
  </div>
</header>

<div id="controles">
  <div class="envolve">
    <label class="oculto-visual" for="busca">Buscar linha por número ou nome</label>
    <input
      id="busca"
      type="search"
      inputmode="search"
      autocomplete="off"
      placeholder="Buscar linha: 608 ou petrópolis">

    <div id="dias" role="group" aria-label="Dia do evento">
      <button type="button" class="botao-dia" data-dia="2026-09-05" aria-pressed="false">
        <span class="dia-numero">05/09</span>
        <span class="dia-nome">sáb</span>
      </button>
      <button type="button" class="botao-dia" data-dia="2026-09-06" aria-pressed="false">
        <span class="dia-numero">06/09</span>
        <span class="dia-nome">dom</span>
      </button>
      <button type="button" class="botao-dia" data-dia="2026-09-07" aria-pressed="false">
        <span class="dia-numero">07/09</span>
        <span class="dia-nome">seg</span>
      </button>
    </div>
  </div>

  <nav id="abas" aria-label="Seções">
    <div class="envolve" role="tablist">
      <button type="button" class="aba" role="tab" data-tela="mapa" aria-selected="false">Mapa</button>
      <button type="button" class="aba" role="tab" data-tela="avisos" aria-selected="false">Avisos</button>
    </div>
  </nav>
</div>

<!-- Um botao de voltar para o app inteiro, e nao um por tela: quem sabe o
     caminho percorrido e a pilha de app/estado.js, nao a tela desenhada.
     principal.js mostra, esconde e escreve o destino. -->
<div id="navegacao" class="envolve">
  <button type="button" id="voltar" class="botao-voltar" hidden></button>
</div>

<noscript>
  <p class="sem-script">
    Este site precisa de JavaScript para mostrar a programação das linhas.
    Ative o JavaScript no navegador e recarregue a página.
  </p>
</noscript>

<main id="tela" class="envolve" tabindex="-1"></main>

<footer id="rodape">
  <div class="envolve"></div>
</footer>

<script type="module" src="app/principal.js"></script>

<script>
  // Registro do service worker (TASK-09). Fora do modulo de proposito: nao
  // depende de nada do app e nao deve atrasar a primeira renderizacao.
  // Uma falha aqui e sempre nao-fatal — o site continua funcionando online.
  //
  // EM DESENVOLVIMENTO O SW FICA DESLIGADO. O app shell e cache-first: com o
  // SW ativo, editar um arquivo e recarregar continua servindo a copia em
  // cache ate alguem trocar a VERSAO em sw.js. No Live Server do VS Code isso
  // aparece como "o site nao esta trazendo a versao atualizada" — sem erro
  // nenhum no console, o que torna o diagnostico dificil.
  //
  // O unregister nao e simetrico ao register: ele existe para limpar um SW que
  // ja tenha ficado preso numa maquina de desenvolvimento. Sem isso, quem ja
  // registrou uma vez continuaria travado mesmo depois desta correcao.
  (function () {
    if (!('serviceWorker' in navigator)) return;

    var local = ['localhost', '127.0.0.1', '::1', ''].indexOf(location.hostname) !== -1;

    if (local) {
      navigator.serviceWorker.getRegistrations().then(function (registros) {
        registros.forEach(function (registro) { registro.unregister(); });
      });
      if (window.caches) {
        caches.keys().then(function (nomes) {
          nomes.forEach(function (nome) {
            if (nome.indexOf('passo-a-paco-') === 0) caches.delete(nome);
          });
        });
      }
      return;
    }

    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function (erro) {
        console.warn('Service worker nao registrado:', erro);
      });
    });
  })();
</script>
</body>
</html>
